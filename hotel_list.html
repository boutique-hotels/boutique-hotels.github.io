<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ホテル料金比較</title>
  <style>
    :root {
      --accent: #2563eb;
      --accent-soft: #eef2ff;
      --border: #dcdfe4;
      --text-muted: #6b7280;
      --bg-stripe: #f9fafb;
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, "Hiragino Kaku Gothic ProN", sans-serif;
      padding: 16px;
      color: #1f2328;
      background: #fff;
    }
    h1 { margin-bottom: 4px; font-size: 22px; }
    .subtitle { color: var(--text-muted); font-size: 13px; margin-bottom: 16px; }
    h2 { margin-top: 32px; margin-bottom: 10px; font-size: 17px; border-left: 4px solid var(--accent); padding-left: 8px; }

    /* ---- ホテルカード ---- */
    details > summary {
      cursor: pointer;
      font-weight: 600;
      font-size: 15px;
      padding: 6px 2px;
      border-left: 4px solid var(--accent);
      padding-left: 8px;
      margin-top: 24px;
    }
    .hotel-cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 12px;
      margin: 10px 0 8px;
    }
    .hotel-card-toolbar {
      margin: 10px 0 4px;
      font-size: 12px;
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      align-items: flex-end;
    }
    .hotel-card {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      font-size: 13px;
      background: #fff;
    }
    .hotel-card h3 {
      margin: 0 0 6px 0;
      font-size: 14px;
    }
    .hotel-card .row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin: 3px 0;
      color: var(--text-muted);
    }
    .hotel-card .row .val { color: #1f2328; text-align: right; }
    .hotel-card a { color: var(--accent); text-decoration: none; }
    .hotel-card a:hover { text-decoration: underline; }
    .badge {
      display: inline-block;
      font-size: 11px;
      padding: 1px 7px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      margin: 2px 3px 0 0;
    }
    .badge.vacant { background: #dcfce7; color: #16a34a; }
    .badge.full { background: #fee2e2; color: #dc2626; }
    .badge.na { background: #f3f4f6; color: var(--text-muted); }
    .amenity-tags { margin-top: 4px; }
    .amenity-tag {
      display: inline-block;
      font-size: 10.5px;
      padding: 1px 6px;
      border: 1px solid var(--border);
      border-radius: 4px;
      margin: 2px 3px 0 0;
      color: #444;
    }
    .no-data { color: #bbb; font-style: italic; }

    /* 料金比較表・部屋比較表: タイトル(summary)も一緒に固定表示 */
    /* summary は既定で display:list-item になっており、position:sticky との
       組み合わせが一部ブラウザ（特にモバイル）で不安定なため、display:block に
       変更する。失われる開閉の▼マークは疑似要素で自前で再現する。 */
    .sticky-section > summary {
      display: block;
      list-style: none;
      cursor: pointer;
      position: sticky;
      top: 0;
      z-index: 30;
      background: #fff;
    }
    .sticky-section > summary::-webkit-details-marker { display: none; }
    .sticky-section > summary::before {
      content: "▶";
      display: inline-block;
      width: 1em;
      color: var(--accent);
    }
    .sticky-section[open] > summary::before {
      content: "▼";
    }
    .sticky-section .sticky-toolbar {
      position: sticky;
      top: var(--summary-h, 34px);
      z-index: 25;
      background: #fff;
      padding: 6px 2px;
      display: block;
      width: 100%;
    }
    .sticky-section thead th {
      top: calc(var(--summary-h, 34px) + var(--toolbar-h, 0px));
      z-index: 20;
    }
    .sticky-section th:first-child { z-index: 21; }

    /* ---- 表 ---- */
    .table-scroll {
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 24px;
    }
    table { border-collapse: collapse; width: 100%; min-width: 900px; font-size: 13px; }
    th, td { border-bottom: 1px solid var(--border); border-right: 1px solid #eee; padding: 6px 8px; text-align:center; white-space: nowrap; }
    th { background: #f4f4f4; position: sticky; top: 0; z-index: 10; cursor: pointer; user-select: none; }
    th.sortable:hover { background: #eaeaea; }
    th .sort-arrow { font-size: 10px; color: var(--accent); margin-left: 2px; }
    /* 1列目（ホテル名）を横スクロールでも固定表示 */
    th:first-child, td:first-child {
      position: sticky; left: 0; background: #fff; z-index: 5;
      text-align: left; white-space: normal; max-width: 160px;
    }
    th:first-child { z-index: 15; background: #f4f4f4; }
    tbody tr:nth-child(even) td { background: var(--bg-stripe); }
    tbody tr:nth-child(even) td:first-child { background: #f3f4f6; }
    tbody tr:hover td { background: #eef2ff; }
    tbody tr:hover td:first-child { background: #e0e7ff; }

    .filter-input { width: 95%; font-size: 12px; }
    .filter-wide { width: 150px; font-size: 12px; }
    .filter-range { width: 64px; font-size: 12px; }
    .filter-row { font-size: 11px; }
    .clear-btn {
      margin: 8px 0; padding: 5px 12px; font-size: 12px;
      border: 1px solid var(--accent); color: var(--accent);
      background: #fff; border-radius: 5px; cursor: pointer;
    }
    .clear-btn:hover { background: var(--accent-soft); }
    .sticky-toolbar.subtitle { margin: 0; padding-bottom: 10px; }

    @media (max-width: 640px) {
      body { padding: 10px 10px 24px; }
      h1 { font-size: 18px; }
      .subtitle { font-size: 12px; }
      h2 { font-size: 15px; margin-top: 24px; }

      .hotel-cards { grid-template-columns: 1fr; }
      .hotel-card { font-size: 13px; padding: 10px; }

      /* details のタイトル行はタップしやすい高さを確保 */
      details > summary { padding: 10px 2px 10px 10px; font-size: 14px; }

      /* ホテル一覧の絞り込みツールバー: 各項目を縦積みでフル幅に */
      .hotel-card-toolbar { flex-direction: column; align-items: stretch; gap: 10px; }
      .hotel-card-toolbar > div { width: 100%; }
      .hotel-card-toolbar select.filter-wide { min-width: 0; width: 100%; }

      /* フォーム部品のタップ領域を確保（44px目安） */
      input[type="text"], input[type="number"], input.filter-input,
      input.filter-wide, input.filter-range, select {
        font-size: 14px;
        min-height: 34px;
        padding: 4px 6px;
      }
      input[type="checkbox"] {
        width: 18px;
        height: 18px;
        vertical-align: middle;
      }
      .clear-btn, .sidebar-toggle {
        min-height: 38px;
        font-size: 13px;
      }
      a { -webkit-tap-highlight-color: rgba(37,99,235,0.15); }

      /* 表は横スクロールが前提になるため、その場で分かるようヒントを出す */
      .sticky-section .scroll-hint {
        display: block;
        font-size: 11px;
        color: var(--text-muted);
        margin: 4px 0 6px;
      }

      /* 表本体は少しコンパクトに（ヘッダー固定の白帯とも揃えたいので min-width はそのまま） */
      table { font-size: 12px; }
      th, td { padding: 5px 6px; }
      th:first-child, td:first-child { max-width: 120px; }

      /* ホテルカードの内訳タグも詰めて表示 */
      .amenity-tag, .badge { font-size: 10px; }
    }

    .scroll-hint { display: none; }

    /* ---- サイドバーメニュー ---- */
    body {
      margin-left: 220px;
      transition: margin-left 0.2s ease;
    }
    body.sidebar-collapsed { margin-left: 48px; }

    .sidebar {
      position: fixed;
      top: 0; left: 0;
      width: 220px;
      height: 100vh;
      background: #f8f9fa;
      border-right: 1px solid var(--border);
      padding: 14px 12px;
      overflow-y: auto;
      z-index: 200;
      transition: width 0.2s ease, transform 0.2s ease;
      box-sizing: border-box;
    }
    .sidebar-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .sidebar-brand {
      font-weight: 700;
      font-size: 13.5px;
      white-space: nowrap;
      overflow: hidden;
    }
    .sidebar-toggle {
      background: none;
      border: 1px solid var(--border);
      border-radius: 5px;
      cursor: pointer;
      font-size: 15px;
      line-height: 1;
      padding: 5px 8px;
      color: #444;
      flex-shrink: 0;
    }
    .sidebar-toggle:hover { background: var(--accent-soft); color: var(--accent); }
    .sidebar nav a {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 6px;
      border-radius: 6px;
      color: #333;
      text-decoration: none;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      margin-bottom: 2px;
    }
    .sidebar nav a:hover { background: var(--accent-soft); color: var(--accent); }
    .sidebar-icon { width: 18px; text-align: center; flex-shrink: 0; }
    .sidebar-label { overflow: hidden; text-overflow: ellipsis; }

    /* 折りたたみ（デスクトップ：アイコンのみの細いバーに） */
    .sidebar.collapsed { width: 48px; padding: 14px 8px; }
    .sidebar.collapsed .sidebar-brand,
    .sidebar.collapsed .sidebar-label { display: none; }
    .sidebar.collapsed .sidebar-top { justify-content: center; }

    .sidebar-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      z-index: 150;
    }
    .sidebar-backdrop.show { display: block; }

    @media (max-width: 640px) {
      body { margin-left: 0 !important; }
      .sidebar {
        width: 230px;
        transform: translateX(-100%);
        box-shadow: 2px 0 14px rgba(0,0,0,0.15);
      }
      .sidebar.mobile-open { transform: translateX(0); }
      .sidebar.collapsed { width: 230px; padding: 14px 12px; }
      .sidebar.collapsed .sidebar-brand,
      .sidebar.collapsed .sidebar-label { display: inline; }
      .sidebar.collapsed .sidebar-top { justify-content: space-between; }
    }
  </style>
</head>
<body>

<div class="sidebar-backdrop" id="sidebarBackdrop"></div>
<div class="sidebar" id="sidebar">
  <div class="sidebar-top">
    <span class="sidebar-brand">メニュー</span>
    <button class="sidebar-toggle" id="sidebarToggle" title="メニューの開閉" type="button">☰</button>
  </div>
  <nav>
    <a href="#section-hotels"><span class="sidebar-icon">🏨</span><span class="sidebar-label">ホテル一覧</span></a>
    <a href="#section-price"><span class="sidebar-icon">💴</span><span class="sidebar-label">料金比較表</span></a>
    <a href="#section-rooms"><span class="sidebar-icon">🛏️</span><span class="sidebar-label">部屋比較表</span></a>
  </nav>
</div>


<h1>ホテル料金比較</h1>
<div class="subtitle">hotels.json を読み込んで自動生成しています</div>
<div id="content">読み込み中...</div>

<script>
  // ---- サイドバー開閉 ----
  (function () {
    const sidebar = document.getElementById("sidebar");
    const toggleBtn = document.getElementById("sidebarToggle");
    const backdrop = document.getElementById("sidebarBackdrop");

    function isMobile() {
      return window.innerWidth <= 640;
    }

    let open = !isMobile(); // デスクトップ: デフォルト展開 / モバイル: デフォルト折りたたみ

    function applyState() {
      if (isMobile()) {
        sidebar.classList.remove("collapsed");
        sidebar.classList.toggle("mobile-open", open);
        backdrop.classList.toggle("show", open);
        document.body.classList.remove("sidebar-collapsed");
      } else {
        sidebar.classList.remove("mobile-open");
        backdrop.classList.remove("show");
        sidebar.classList.toggle("collapsed", !open);
        document.body.classList.toggle("sidebar-collapsed", !open);
      }
    }

    toggleBtn.addEventListener("click", () => {
      open = !open;
      applyState();
    });

    backdrop.addEventListener("click", () => {
      open = false;
      applyState();
    });

    // モバイルではメニュー項目タップ後に自動で閉じる／対象セクションが折りたたまれていれば展開する
    sidebar.querySelectorAll("nav a").forEach(a => {
      a.addEventListener("click", (e) => {
        const targetId = a.getAttribute("href").slice(1);
        const targetEl = document.getElementById(targetId);
        if (targetEl && targetEl.tagName === "DETAILS" && !targetEl.open) {
          e.preventDefault();
          targetEl.open = true;
          requestAnimationFrame(() => {
            targetEl.scrollIntoView({ behavior: "smooth", block: "start" });
          });
        }
        if (isMobile()) {
          open = false;
          applyState();
        }
      });
    });

    window.addEventListener("resize", applyState);

    applyState();
  })();

  fetch("hotels.json")
    .then(res => res.json())
    .then(hotels => render(hotels))
    .catch(err => {
      document.getElementById("content").textContent = "JSON読み込みエラー: " + err;
    });

  // プラン種類判定
  function detectPlanType(planName) {
    const name = planName.toLowerCase();

    if (name.includes("stay")) return "宿泊";
    if (name.includes("rest")) return "休憩";
    if (name.includes("flex") || name.includes("フレックス")) return "フリータイム";
	if (name.includes("service time") || name.includes("srevice time") || planName.includes("サービスタイム"))
	  return "フリータイム";

    if (planName.includes("宿泊")) return "宿泊";
    if (planName.includes("休憩")) return "休憩";
    if (planName.includes("フリー") || planName.includes("フレックスタイム")) return "フリータイム";
    if (planName.includes("ショート")) return "ショートタイム";

    return "その他";
  }

  // 種類一覧を JSON から抽出
  function getPlanTypes(hotels) {
    const types = new Set();
    hotels.forEach(hotel => {
      hotel.prices.forEach(plan => {
        types.add(detectPlanType(plan.name));
      });
    });
    return Array.from(types);
  }

  // 料金抽出（最低料金・最高料金）
  function parsePriceRange(priceStr) {
    // 「xxx均一」対応：両方同じ値にする
    if (priceStr.includes("均一")) {
      const num = parseInt(priceStr.replace(/[￥,均一]/g, ""));
      return [num, num];
    }

    // 通常の「￥5,900～￥15,070」など
    const nums = priceStr.replace(/[￥,]/g, "").split("～");
    if (nums.length === 1) {
      const v = parseInt(nums[0]);
      return [v, v];
    }
    return [parseInt(nums[0]), parseInt(nums[1])];
  }


  // 時間抽出（数値化）
  // 時間の数値化結果を小数第2位までに丸める（1.5, 2.25 などを綺麗に保つ）
  function roundHours(h) {
    return Math.round(h * 100) / 100;
  }

  function parseTimeToHours(timeZone) {
    // "最大X時間Y分" または "最大X時間"（Y分は任意）
    const maxMatch = timeZone.match(/最大\s*([0-9]+)\s*時間(?:\s*([0-9]+)\s*分)?/);
    if (maxMatch) {
      const h = parseInt(maxMatch[1]);
      const min = maxMatch[2] ? parseInt(maxMatch[2]) : 0;
      return roundHours(h + min / 60);
    }

    // "X時間Y分" または "X時間"（Y分は任意）
    const hourMatch = timeZone.match(/([0-9]+)\s*時間(?:\s*([0-9]+)\s*分)?/);
    if (hourMatch) {
      const h = parseInt(hourMatch[1]);
      const min = hourMatch[2] ? parseInt(hourMatch[2]) : 0;
      return roundHours(h + min / 60);
    }

    // 時間表記が無く「Y分」のみの場合
    const minOnlyMatch = timeZone.match(/^\s*([0-9]+)\s*分\s*$/);
    if (minOnlyMatch) {
      return roundHours(parseInt(minOnlyMatch[1]) / 60);
    }

    const rangeMatch = timeZone.match(/([0-9:]+)～(.+)/);
    if (rangeMatch) {
      const start = rangeMatch[1];
      const end = rangeMatch[2];

      const toMinutes = t => {
        const [h, m] = t.split(":").map(Number);
        return h * 60 + (m || 0);
      };

      let s = toMinutes(start);
      let e = toMinutes(end.replace("翌 ", ""));

      if (end.includes("翌")) e += 24 * 60;

      return roundHours((e - s) / 60);
    }

    return null;
  }

  // 曜日判定（完全版）
  function detectWeekFlags(text) {

    // ============================
    // 0. ピンポイント例外処理（最優先）
    // ============================

    const raw = text.replace(/[【】]/g, "").trim();

    // 金 / 金曜 / 金曜日
    if (/^金$|^金曜$|^金曜日$/.test(raw)) {
      return { 月:"", 火:"", 水:"", 木:"", 金:"○", 土:"", 日:"", 祝:"", 祝前:"" };
    }

    // 土・祝前
    if (/^土.?祝前$/.test(raw)) {
      return { 月:"", 火:"", 水:"", 木:"", 金:"", 土:"○", 日:"", 祝:"", 祝前:"○" };
    }

    // 日・祝
    if (/^日.?祝$/.test(raw)) {
      return { 月:"", 火:"", 水:"", 木:"", 金:"", 土:"", 日:"○", 祝:"○", 祝前:"" };
    }

    // 土・特日 → 特日は祝扱い
    if (/^土.?特日$/.test(raw)) {
      return { 月:"", 火:"", 水:"", 木:"", 金:"", 土:"○", 日:"", 祝:"○", 祝前:"" };
    }

    // 金・祝前
    if (/^金.?祝前$/.test(raw)) {
      return { 月:"", 火:"", 水:"", 木:"", 金:"○", 土:"", 日:"", 祝:"", 祝前:"○" };
    }

    // 金・土・日・祝・祝前
    if (/^金.?土.?日.?祝.?祝前$/.test(raw)) {
      return { 月:"", 火:"", 水:"", 木:"", 金:"○", 土:"○", 日:"○", 祝:"○", 祝前:"○" };
    }


    // ============================
    // 1. クレンジング辞書（表記ゆれ吸収）
    // ============================
    const CLEANSE_MAP = {
      // 単独曜日（日本語）
      "月": "月", "火": "火", "水": "水", "木": "木",
      "金": "金", "土": "土", "日": "日",

      "月曜": "月", "月曜日": "月",
      "火曜": "火", "火曜日": "火",
      "水曜": "水", "水曜日": "水",
      "木曜": "木", "木曜日": "木",
      "金曜": "金", "金曜日": "金",
      "土曜": "土", "土曜日": "土",
      "日曜": "日", "日曜日": "日",

      // 英語 → 日本語
      "friday": "金",
      "sataday": "土",
      "saturday": "土",
      "sunday": "日",
      "week day": ["月","火","水","木","金"],
      "weekday": ["月","火","水","木","金"],
      "holidays": "祝",
      "before holidays": "祝前",

      // 特殊語
      "平日": ["月","火","水","木","金"],
      "週末": ["土","日","祝"],
      "休日": ["日","祝"],
      "特日": "祝",
      "祝前日": "祝前",
      "祝中": "祝",
      "全日": ["月","火","水","木","金","土","日","祝","祝前"],

      // 無視語
      "連休中日": null,
      "連休中": null,
      "特別日": "祝",
      "1部": null,
      "2部": null,
      "I部": null,
      "II部": null,
      "Aタイプ": null,
      "Bタイプ": null,
      "ランク": null,
    };


    // ============================
    // 2. クレンジング（辞書＋前処理）
    // ============================
    function cleanseWeekText(raw) {
      if (!raw) return [];

      let t = raw.toLowerCase();

      // 条件文削除
      t = t.split("※")[0];
      t = t.replace(/（チェックイン.*?）/g, "");
      t = t.replace(/\(チェックイン.*?\)/g, "");

      // 部制削除
      t = t.replace(/1部|2部|I部|II部/g, "");

      // ランク条件削除
      t = t.replace(/Aランク|Bランク|Cランク|Dランク|Eランク/g, "");

      // 括弧削除
      t = t.replace(/[（）\(\)［］【】]/g, "");

      // 全角中点統一
      t = t.replace(/･/g, "・");

      // 連結語分割
      t = t.replace(/土日祝/g, "土・日・祝");
      t = t.replace(/土日/g, "土・日");

      // 英語→日本語（辞書）
      Object.keys(CLEANSE_MAP).forEach(key => {
        const lowerKey = key.toLowerCase();
        if (t.includes(lowerKey)) {
          const v = CLEANSE_MAP[key];
          const rep = Array.isArray(v) ? v.join("・") : (v || "");
          t = t.replace(new RegExp(lowerKey, "g"), rep);
        }
      });

      // トークン化
      let tokens = t.split(/・|\/|／|,/)
        .map(s => s.trim())
        .filter(s => s.length > 0);

      return tokens;
    }


    // ============================
    // 3. 構造解析（意味抽出）
    // ============================
    function interpretWeekTokens(tokens) {
      const flags = {
        "月": "", "火": "", "水": "", "木": "", "金": "", "土": "", "日": "", "祝": "", "祝前": ""
      };

      const days = ["日","月","火","水","木","金","土"];

      let excludeHoliday = false;
      let excludeBeforeHoliday = false;

      tokens.forEach(token => {

        // 除く系
        if (token.includes("除く")) {
          if (token.includes("祝前")) excludeBeforeHoliday = true;
          if (token.includes("祝")) excludeHoliday = true;
          if (token.includes("特日")) excludeHoliday = true;
          return;
        }

        // 区間系
        const range = token.match(/([日月火水木金土])曜?～([日月火水木金土])曜?/);
        if (range) {
          const s = days.indexOf(range[1]);
          const e = days.indexOf(range[2]);
          for (let i = s; i <= e; i++) flags[days[i]] = "○";
          return;
        }

        // 複数系
        const parts = token.split(/・/);
        if (parts.length > 1) {
          parts.forEach(p => {
            if (CLEANSE_MAP[p]) {
              const v = CLEANSE_MAP[p];
              if (Array.isArray(v)) {
                v.forEach(d => flags[d] = "○");
              } else if (v) {
                flags[v] = "○";
              }
            } else if (days.includes(p)) {
              flags[p] = "○";
            }
          });
          return;
        }

        // 特殊語
        if (token === "平日") {
          ["月","火","水","木","金"].forEach(d => flags[d] = "○");
          return;
        }
        if (token === "週末") {
          ["土","日","祝"].forEach(d => flags[d] = "○");
          return;
        }
        if (token === "休日") {
          ["日","祝"].forEach(d => flags[d] = "○");
          return;
        }
        if (token === "特日") {
          flags["祝"] = "○";
          return;
        }
        if (token === "全日") {
          ["月","火","水","木","金","土","日","祝","祝前"].forEach(d => flags[d] = "○");
          return;
        }

        // 単独曜日
        if (days.includes(token)) {
          flags[token] = "○";
          return;
        }

        // 祝前
        if (token === "祝前") {
          flags["祝前"] = "○";
          return;
        }

        // 祝
        if (token === "祝" || token === "祝日") {
          flags["祝"] = "○";
          return;
        }
      });

      // 除く処理
      if (excludeHoliday) flags["祝"] = "";
      if (excludeBeforeHoliday) flags["祝前"] = "";

      return flags;
    }


    // ============================
    // 4. 最終判定（辞書＋構造解析のハイブリッド）
    // ============================
    const tokens = cleanseWeekText(text);
    return interpretWeekTokens(tokens);
  }

    function drawTable() {

      const planFilter = document.getElementById("filterPlan").value.toLowerCase();
      const typeFilter = Array.from(document.getElementById("filterType").selectedOptions).map(o => o.value);

      const minPrice = parseInt(document.getElementById("minPrice").value) || 0;
      const maxPrice = parseInt(document.getElementById("maxPrice").value) || Infinity;

      const minHours = parseInt(document.getElementById("minHours").value) || 0;
      const maxHours = parseInt(document.getElementById("maxHours").value) || Infinity;

      const weekChecks = Array.from(document.querySelectorAll("input[name='week']:checked")).map(c => c.value);

      let rows = [];

      hotels.forEach(hotel => {
        hotel.prices.forEach(plan => {
          const planType = detectPlanType(plan.name);

          plan.priceInfo.forEach(info => {
			// const flags = detectWeekFlags(info.week + " " + plan.name);
			let flags = detectWeekFlags(info.week);

			// ○が1つも付いていない場合 → plan.name でも判定する
			if (!Object.values(flags).includes("○")) {
			  flags = detectWeekFlags(plan.name);
			}

            info.timePrice.forEach(tp => {
              const [minP, maxP] = parsePriceRange(tp.price);
              const hours = parseTimeToHours(tp.timeZone);

              if (hotelFilter && !hotel.name.toLowerCase().includes(hotelFilter)) return;
              if (planFilter && !plan.name.toLowerCase().includes(planFilter)) return;
              if (typeFilter.length && !typeFilter.includes(planType)) return;
              if (timeZoneFilter && !tp.timeZone.toLowerCase().includes(timeZoneFilter)) return;

              if (minP < minPrice || maxP > maxPrice) return;
              if (hours !== null && (hours < minHours || hours > maxHours)) return;

              if (weekChecks.length) {
                let ok = false;
                weekChecks.forEach(w => {
                  if (flags[w] === "○") ok = true;
                });
                if (!ok) return;
              }

              rows.push({

                plan: plan.name,
                type: planType,
                priceRaw: tp.price,
                minPrice: minP,
                maxPrice: maxP,
                timeZone: tp.timeZone,
                hours: hours,
                weekText: info.week,
                flags: flags
              });
            });
          });

            cmp = String(va ?? "").localeCompare(String(vb ?? ""), "ja");
          } else {
            va = va ?? -Infinity;
            vb = vb ?? -Infinity;

	      roomSortState.column = col;
	      roomSortState.asc = true;
	    }
	    drawRoomTable();
	  });
	});

	const roomScroll = document.createElement("div");
	roomScroll.className = "table-scroll";
	roomScroll.appendChild(roomTable);
	roomDetails.appendChild(roomScroll);

	drawRoomTable();
	document.getElementById("filterKeepValue").addEventListener("change", drawRoomTable);

	syncStickyOffsets();
  }

  // 「料金比較表」「部屋比較表」のタイトル(summary)と、直下のツールバー
  // （フィルタをクリア／在庫参考値の注記）の実測高さを、
  // 各セクション配下のthead th の sticky top オフセットに反映する
  function updateSectionStickyLayout(sec) {
    const summary = sec.querySelector(":scope > summary");
    const toolbar = sec.querySelector(":scope > .sticky-toolbar");
    const scrollArea = sec.querySelector(".table-scroll");
    const tableEl = scrollArea ? scrollArea.querySelector("table") : null;

    // タイトル・ツールバーの幅を「ブラウザの表示幅」ではなく「表(table要素)の実際の幅」に合わせる。
    // .table-scroll は overflow を持たないため、中の table が min-width で
    // はみ出しても div 自体は広がらない。そのため div ではなく table 自身の
    // レンダリング幅を測る必要がある。
    // +2px は端数（サブピクセル）による1pxの透けすき間を防ぐための安全マージン。
    if (tableEl) {
      const tableWidth = (Math.ceil(tableEl.getBoundingClientRect().width) + 2) + "px";
      if (summary) summary.style.width = tableWidth;
      if (toolbar) toolbar.style.width = tableWidth;
    }

    if (summary) {
      sec.style.setProperty("--summary-h", summary.getBoundingClientRect().height + "px");
    }
    if (toolbar) {
      sec.style.setProperty("--toolbar-h", toolbar.getBoundingClientRect().height + "px");
    } else {
      sec.style.setProperty("--toolbar-h", "0px");
    }
  }

  function syncStickyOffsets() {
    document.querySelectorAll(".sticky-section").forEach(updateSectionStickyLayout);
  }
  window.addEventListener("resize", syncStickyOffsets);

  // 表のサイズは、フィルタ操作や画像読み込み、フォント確定などで
  // タイトル・ツールバーの高さ（--summary-h / --toolbar-h）はウィンドウ幅によって
  // 表のサイズは、フィルタ操作や画像読み込み、フォント確定などで
  // レイアウト後にも変化しうるため、ResizeObserverで継続的に幅を追従させる。
  if (typeof ResizeObserver !== "undefined") {
    document.querySelectorAll(".sticky-section").forEach(sec => {
      const tableEl = sec.querySelector(".table-scroll table");
      if (tableEl) {
        const ro = new ResizeObserver(() => updateSectionStickyLayout(sec));
        ro.observe(tableEl);
      }
    });
  }
</script>

</body>
</html>
